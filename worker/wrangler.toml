name = "solar"
main = "src/index.ts"
compatibility_date = "2024-04-01"
workers_dev = true

[vars]
STABLE_VERSION = "1.0.0"
WORKER_URL = "https://solar.kreier.workers.dev"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "solar-db"
database_id = "0a88a337-1afe-4ef4-a5e2-da58d5716274"
migrations_dir = "migrations"

# Secrets required in production:
# wrangler secret put MASTER_PHRASE
