; PlatformIO Project Configuration File for kreier/solar
; Version: 1.0.2
; Standard Dual OTA with Core Dump support

[platformio]
default_envs = esp32dev, esp32s3
src_dir = src
include_dir = include
boards_dir = boards

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -D CORE_DEBUG_LEVEL=1

[env:esp32dev]
board = esp32dev
board_build.partitions = partitions/min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D FIRMWARE_VERSION=\"1.0.2\"
    -D TARGET_BOARD=\"ESP32\"

[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/s3_16mb.csv
build_flags =
    ${env.build_flags}
    -D FIRMWARE_VERSION=\"1.1.3-canary\"
    -D TARGET_BOARD=\"ESP32-S3\"
    -D BOARD_HAS_16MB_FLASH

[env:esp32c5]
board = esp32c5
board_build.partitions = partitions/min_spiffs.csv
build_flags =
    ${env.build_flags}
    -D FIRMWARE_VERSION=\"1.0.2\"
    -D TARGET_BOARD=\"ESP32-C5\"
    -D BOARD_HAS_WIFI6
