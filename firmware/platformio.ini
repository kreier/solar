; PlatformIO Project Configuration File for kreier/solar
; Minimal SPIFFS, Dual OTA support, and ArduinoJson v7

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D FIRMWARE_VERSION=\"1.0.0\"
